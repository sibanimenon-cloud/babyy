<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Space</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b16;
color:white;
text-align:center;
}

.page{display:none;padding:30px;}
.active{display:block;}

.btn{
padding:12px 18px;
margin-top:20px;
background:#ff4d6d;
border:none;
color:white;
border-radius:10px;
}

img{
width:240px;
margin:10px;
border-radius:15px;
}

/* candle */
.candle{
height:60vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.wax{
width:90px;
height:240px;
background:#fff3d6;
border-radius:15px;
position:relative;
}

.flame{
width:26px;
height:48px;
background:orange;
border-radius:50%;
position:absolute;
top:-38px;
left:50%;
transform:translateX(-50%);
animation:flicker 0.8s infinite;
}

@keyframes flicker{
0%{transform:translateX(-50%) scale(1);}
50%{transform:translateX(-50%) scale(1.2);}
100%{transform:translateX(-50%) scale(1);}
}

/* hearts */
.heart{
font-size:32px;
position:absolute;
animation:float 3s linear;
cursor:pointer;
}

#gameArea{
position:relative;
height:300px;
overflow:hidden;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-350px);opacity:0;}
}
</style>
</head>

<body>

<div id="p1" class="page active">
<h1>Memory Space</h1>
<button class="btn" onclick="go(2)">Start</button>
</div>

<div id="p2" class="page">
<h2>Blow Candle</h2>

<div class="candle">
<div class="wax">
<div id="flame" class="flame"></div>
</div>
</div>

<button class="btn" onclick="blow()">Blow</button>
</div>

<div id="p3" class="page">
<h2>Catch 10 Hearts</h2>
<p id="score">0 / 10</p>
<div id="gameArea"></div>
</div>

<div id="p4" class="page">
<h2>Memories</h2>
<img src="photo1.png">
<img src="photo2.jpeg">
<button class="btn" onclick="go(5)">Next</button>
</div>

<div id="p5" class="page">
<h2>Music</h2>
<audio controls autoplay loop>
<source src="song.mp3">
</audio>
<button class="btn" onclick="go(6)">Final</button>
</div>

<div id="p6" class="page">
<h2>Done</h2>
<p>Memory complete</p>
</div>

<script>

function go(n){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById('p'+n).classList.add('active');

if(n==3){
startGame();
}
}

function blow(){
document.getElementById("flame").style.display="none";
setTimeout(()=>go(3),800);
}

/* GAME */
let score=0;
let running=false;

function startGame(){
if(running) return;
running=true;
score=0;
spawn();
}

function spawn(){
if(score>=10){
setTimeout(()=>go(4),800);
return;
}

let h=document.createElement("div");
h.innerHTML="❤";
h.className="heart";

h.style.left=Math.random()*80+"%";
h.style.top="80%";

h.onclick=function(){
score++;
document.getElementById("score").innerText=score+" / 10";
h.remove();
}

document.getElementById("gameArea").appendChild(h);

setTimeout(()=>h.remove(),3000);
setTimeout(spawn,1200);
}

</script>

</body>
</html>
