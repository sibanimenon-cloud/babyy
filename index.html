<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Space</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0b16;
color:white;
text-align:center;
}

.page{
display:none;
padding:30px;
}

.active{
display:block;
}

.btn{
padding:12px 18px;
margin-top:20px;
background:#ff4d6d;
border:none;
color:white;
border-radius:10px;
}

img{
width:240px;
margin:10px;
border-radius:15px;
}

/* CANDLE */
.candle{
width:100%;
height:60vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.wax{
width:90px;
height:240px;
background:#fff3d6;
border-radius:15px;
position:relative;
box-shadow:0 0 25px rgba(255,255,255,0.3);
}

.flame{
width:26px;
height:48px;
background:orange;
border-radius:50%;
position:absolute;
top:-38px;
left:50%;
transform:translateX(-50%);
animation:flicker 0.8s infinite;
}

@keyframes flicker{
0%{transform:translateX(-50%) scale(1);opacity:1;}
50%{transform:translateX(-50%) scale(1.2);opacity:0.6;}
100%{transform:translateX(-50%) scale(1);opacity:1;}
}

/* HEART GAME */
.heart{
font-size:32px;
position:absolute;
cursor:pointer;
animation:float 3s linear;
}

#gameArea{
position:relative;
height:300px;
overflow:hidden;
margin-top:20px;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-350px);opacity:0;}
}
</style>
</head>

<body>

<div id="page1" class="page active">
<h1>Your Memory Space</h1>
<button class="btn" onclick="next(2)">Start</button>
</div>

<div id="page2" class="page">
<h2>Blow the Candle</h2>

<div class="candle">
<div class="wax">
<div id="flame" class="flame"></div>
</div>
</div>

<button class="btn" onclick="blow()">Blow</button>
</div>

<div id="page5" class="page">
<h2>Catch 10 Hearts to Unlock Memory Heart</h2>

<p id="score">Score: 0 / 10</p>

<div id="gameArea"></div>
</div>

<div id="page3" class="page">
<h2>Memories</h2>

<img src="photo1.png">
<img src="photo2.jpeg">

<br>
<button class="btn" onclick="next(4)">Next</button>
</div>

<div id="page4" class="page">
<h2>Music</h2>

<audio controls autoplay loop>
<source src="song.mp3" type="audio/mpeg">
</audio>

<br>
<button class="btn" onclick="next(6)">Final</button>
</div>

<div id="page6" class="page">
<h2>Restart</h2>
<button class="btn" onclick="next(2)">Restart Candle</button>
</div>

<script>
function next(n){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById('page'+n).classList.add('active');
}

function blow(){
document.getElementById("flame").style.display="none";
setTimeout(()=>next(5),800);
}

/* GAME */
let score=0;
let gameRunning=false;

function spawnHeart(){
if(score>=10){
document.getElementById("score").innerText="Unlocked Memory Heart";
setTimeout(()=>next(3),1000);
return;
}

let heart=document.createElement("div");
heart.innerHTML="❤";
heart.classList.add("heart");

heart.style.left=Math.random()*80+"%";
heart.style.top="80%";

heart.onclick=function(){
score++;
document.getElementById("score").innerText="Score: "+score+" / 10";
heart.remove();
}

document.getElementById("gameArea").appendChild(heart);

setTimeout(()=>heart.remove(),3000);
setTimeout(()=>spawnHeart(),1200);
}

function next(n){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById('page'+n).classList.add('active');

if(n===5 && !gameRunning){
gameRunning=true;
score=0;
document.getElementById("score").innerText="Score: 0 / 10";
spawnHeart();
}
}
</script>

</body>
</html>
